; ============================================================================
;  Photoreal  -  Assetto Corsa post-processing filter (Content Manager / CSP)
; ----------------------------------------------------------------------------
;  Goal: look like footage from a real camera, not a "game" filter.
;   - Filmic tonemapping with soft highlight roll-off (no blown-out skies)
;   - Near-neutral saturation and contrast (real life is less punchy than mods)
;   - Subtle lens imperfections: light glare, tiny chromatic aberration,
;     gentle vignette - all kept below the "noticeable" threshold
;   - Auto exposure with slow, eye-like adaptation for tunnels and shade
;
;  Best with: Custom Shaders Patch + Sol or Pure, and a Weather FX weather.
;  Install:   assettocorsa\system\cfg\ppfilters\Photoreal.ini
; ============================================================================

[__INFO]
NAME=Photoreal
AUTHOR=Custom
VERSION=1.1
DESCRIPTION=Neutral, camera-like filter with filmic tonemapping and subtle lens effects.

[GENERAL]
ENABLED=1
FXAA=1
FOVBLUR=0

[COLOR]
ENABLED=1
; Slightly under 1.0: AC's default image is oversaturated compared to real life
SATURATION=0.94
BRIGHTNESS=1.00
CONTRAST=1.00
SEPIA=0.00
HUE=0.00
; Very light warm tint, like daylight-balanced film
TINT=255,252,246
TINT_STRENGTH=0.00

[TONEMAPPING]
; v1.1: use a stock curve (works with or without CSP) and lower exposure.
; v1.0 came out heavily overexposed in testing.
FUNCTION=1
EXPOSURE=0.13
GAMMA=1.00

[AUTO_EXPOSURE]
; v1.1: off while tuning - can push brightness up
ENABLED=0
; Narrow range: the eye adapts, but not wildly
MIN=0.75
MAX=1.40
TARGET=0.42
; Slow adaptation (seconds-ish) so tunnels/shade feel natural
SPEED=0.6
CENTER_WEIGHT=0.55

[GLARE]
ENABLED=1
QUALITY=4
; High threshold: only real light sources and hot reflections bloom
THRESHOLD=0.97
GAMMA=1.20
BLOOM_RATIO=0.03
ANAMORPHIC=0
GHOST_RATIO=0.0
STAR_RATIO=0.0
LUMINANCE_PASS=0
; Keep bloom tight and short - big hazy bloom is the #1 "gamey" giveaway
BLOOM_LENGTH=0.50

[GODRAYS]
ENABLED=1
LENGTH=0.22
GLARE_RATIO=0.06
ANGLE_ATTENUATION=1.6
NOISE_MASK=0.25
DEPTH_MASK_THRESHOLD=0.98
COLOR=255,244,226,0.35

[DOF]
; In-game DOF disabled for driving; replays/photo mode use CM's own DOF
ENABLED=0
QUALITY=4
FOCUS_DISTANCE=8
RADIUS=0.25

[CHROMATIC_ABERRATION]
; Barely visible at the screen edges - like a decent real lens
ENABLED=1
SAMPLES=6
LATERAL=0.0008,0.0008
UNIFORM=0.0000,0.0000

[VIGNETTING]
ENABLED=1
STRENGTH=0.28
FOV_DEPENDENT=1

[AIRYDISK]
ENABLED=0

[LENSFLARES]
; Real cockpit cams don't show sci-fi flare chains
ENABLED=0

[HEAT_SHIMMER]
; Only visible on hot days over long straights
ENABLED=1
STRENGTH=0.6
SPEED=0.12
WIDE=6
FADE=0.6

[FEEDBACK]
; Motion trail feedback off - creates ghosting
ENABLED=0
