; ============================================================================
;  Max Visuals (AgX) - post-processing filter for Assetto Corsa
; ----------------------------------------------------------------------------
;  Built for Custom Shaders Patch (0.2.x / 0.3.x) together with Pure, Sol or
;  the default CSP weather style. Every vanilla key is kept, so it also loads
;  without CSP (the EXT_* sections are simply ignored then).
;
;  AgX VARIANT: identical to MaxVisuals, but uses the AgX tonemapper that CSP
;  added in 0.2.1 (build 2654+). AgX keeps very bright, saturated lights -
;  brake lights, headlights, neon, a low sun - from clipping into flat
;  blobs; they roll off to white like on film. REQUIRES CSP 0.2.1 or newer.
;  Older CSP builds or no CSP: use MaxVisuals instead.
;
;  Look: natural and photographic. Filmic highlight roll-off, neutral colour,
;  soft bloom only on genuinely bright things, gentle sun rays, cinematic
;  depth of field on replay/track cameras. No chromatic aberration, lens
;  ghosts, after-images or lens distortion.
;
;  Install : copy into  <assettocorsa>\system\cfg\ppfilters\
;  Select  : Content Manager > Settings > Assetto Corsa > Video >
;            Post-processing filter = MaxVisuals_AgX
;            (or in-game with the PP filter selector in the CSP/AC apps)
;
;  Tuning tips are at the end of this file.
; ============================================================================

[ABOUT]
AUTHOR=Max Visuals pack
VERSION=1.0
NOTES=AgX variant of MaxVisuals (needs CSP 0.2.1+) - AgX tonemapping for natural highlight roll-off plus subtle bloom and sun rays. Made for Pure / Sol / default CSP WeatherFX.
URL=

[YEBIS]
ENABLED=1

[OPTIMIZATIONS]
; 0 = compute bloom, DOF and other effects at the full screen resolution.
; (Kunos' default of 1280 renders them at 1280 px wide and upscales: softer.)
FIXED_WIDTH=0

[VARIOUS]
APERTURE_RESULT_BLUR_MOD=1

; ----------------------------------------------------------------------------
;  Exposure
; ----------------------------------------------------------------------------
[AUTO_EXPOSURE]
; Eye adaptation. When Pure / Sol / the CSP weather style run their own
; exposure logic they take over; these values are the fallback and baseline.
ENABLED=1
DELAY=0
TARGET=0.28
MIN=0.1
MAX=0.7
METERING_WIDTH=100
METERING_HEIGHT=100
METERING_OFFSET_X=0
METERING_OFFSET_Y=0
; Keep the sun's bloom from pumping exposure up and down.
INFLUENCED_BY_GLARE=0

[EXT_AUTO_EXPOSURE]
; CSP: meter the central 60% x 40% of the screen (road ahead + horizon),
; ignoring most of the sky and the dark lower part of the cockpit.
METERING_AREA_DEBUG=0
METERING_AREA_SIZE=0.6,0.4
METERING_AREA_OFFSET=0,0

; ----------------------------------------------------------------------------
;  Tonemapping (HDR -> screen)
; ----------------------------------------------------------------------------
[TONEMAPPING]
HDR=1
; 16 = AgX (CSP 0.2.1+). If the picture looks wrong, your CSP is too old -
; update CSP or switch to the MaxVisuals filter (FUNCTION=2).
FUNCTION=16
; Only used when auto exposure is disabled. Pure/Sol treat ~0.3 as neutral.
EXPOSURE=0.32
; AgX already has a gentle toe, so no extra gamma lift.
GAMMA=1.0
MAPPING_FACTOR=32
SCALE_WIDTH=1
SCALE_HEIGHT=1
OFFSET_X=0
OFFSET_Y=0

[COLOR]
HUE=0
; AgX is slightly flatter and less saturated by design; compensate a little.
SATURATION=1.04
BRIGHTNESS=1
CONTRAST=1.04
SEPIA=0
; Very slightly warm, like a camera set to daylight white balance.
COLOR_TEMP=6350
WHITE_BALANCE=6500

; ----------------------------------------------------------------------------
;  Bloom / glare
; ----------------------------------------------------------------------------
[GLARE]
ENABLED=1
QUALITY=5
; 0 = highest precision
PRECISION=0
GHOST=0
AFTER_IMAGE=0
ANAMORPHIC=0
LUMINANCE=1.6
SHAPE=11
BLUR=1
; Only genuinely bright pixels (sun, lamps, hot specular glints) bloom.
THRESHOLD=2.5
BRIGHT_PASS=1
BLOOM_FILTER_THRESHOLD=0.002
BLOOM_GAUSSIAN_RADIUS_SCALE=2
BLOOM_LUMINANCE_GAMMA=2
; More bloom levels = smoother, wider falloff.
BLOOM_NUM_LEVELS=8
GENERATION_RANGE_SCALE=1
STAR_FILTER_THRESHOLD=0.0002
STAR_SOFTNESS=1
STAR_LENGTH_FOV_DEPENDENCE=0
GHOST_CONCENTRIC_DISTORTION=0
USE_CUSTOM_SHAPE=1
; Effective bloom = SHAPE_LUMINANCE x SHAPE_BLOOM_LUMINANCE = 0.08
; Effective star  = SHAPE_LUMINANCE x SHAPE_STAR_LUMINANCE  = 0.03 (Kunos: 0.125)
SHAPE_LUMINANCE=5
SHAPE_BLOOM_LUMINANCE=0.016
SHAPE_BLOOM_DISPERSION=0.03
SHAPE_BLOOM_DISPERSION_BASE_LEVEL=2
SHAPE_GHOST_LUMINANCE=0
SHAPE_GHOST_HALO_LUMINANCE=0
SHAPE_GHOST_DISTORTION=0
SHAPE_GHOST_SHARPENESS=0
SHAPE_STAR_LUMINANCE=0.006
SHAPE_STAR_STREAKS_NUMBER=6
SHAPE_STAR_LENGTH=0.2
SHAPE_STAR_SECONDARY_LENGTH=1
SHAPE_STAR_ROTATION=1
SHAPE_STAR_INCLINATION_ANGLE=3
SHAPE_STAR_DISPERSION=0
SHAPE_STAR_FORCE_DISPERSION=0
SHAPE_AFTERIMAGE_LUMINANCE=0
SHAPE_AFTERIMAGE_LENGTH=0.5

[EXT_GLARE_FIRSTPERSON_SHAPE]
; CSP: in the cockpit you are looking with your eyes, not a camera lens:
; same soft bloom, much fainter star streaks, no ghosts.
ENABLED=1
SHAPE_LUMINANCE=5
SHAPE_BLOOM_LUMINANCE=0.016
SHAPE_BLOOM_DISPERSION=0.03
SHAPE_BLOOM_DISPERSION_BASE_LEVEL=2
SHAPE_GHOST_LUMINANCE=0
SHAPE_GHOST_HALO_LUMINANCE=0
SHAPE_GHOST_DISTORTION=0
SHAPE_GHOST_SHARPENESS=0
SHAPE_STAR_LUMINANCE=0.003
SHAPE_STAR_STREAKS_NUMBER=6
SHAPE_STAR_LENGTH=0.15
SHAPE_STAR_SECONDARY_LENGTH=1
SHAPE_STAR_ROTATION=1
SHAPE_STAR_INCLINATION_ANGLE=3
SHAPE_STAR_DISPERSION=0
SHAPE_STAR_FORCE_DISPERSION=0
SHAPE_AFTERIMAGE_LUMINANCE=0
SHAPE_AFTERIMAGE_LENGTH=0.5

; ----------------------------------------------------------------------------
;  Sun rays
; ----------------------------------------------------------------------------
[GODRAYS]
; Pure and Sol modulate sun rays with sun angle and weather on top of this.
ENABLED=1
USE_SUN_LIGHT=1
DIFFRACTION_RING=0.15
DIFFRACTION_RING_RADIUS=5
DIFFRACTION_RING_ATTENUATION=0.1
DIFFRACTION_RING_SPECTRUM_ORDER=1
DIFFRACTION_RING_OUTER_COLOR=0.5,0.5,0.5,0.5
COLOR=1,1,1,1
LENGTH=7
GLARE_RATIO=0.015
ANGLE_ATTENUATION=5
NOISE_MASK=0.01
NOISE_FREQUENCY=1
DEPTH_MASK_THRESHOLD=0.999999999

; ----------------------------------------------------------------------------
;  Depth of field (replay / track / chase cameras)
; ----------------------------------------------------------------------------
[DOF]
; Full-frame sensor at f/11: background softens on telephoto replay cameras,
; stays practically sharp on wide driving views.
ENABLED=1
QUALITY=5
APERTURE_F_NUMBER=11
IMAGE_SENSOR_HEIGHT=0.24
BASE_FOV=50
ADAPTIVE_APERTURE_FACTOR=0.5
APERTURE_PARAMETER=2
APERTURE_FRONT_LEVELS_NUMBER=-1
APERTURE_BACK_LEVELS_NUMBER=-1
BACKGROUND_MASK_THRESHOLD=0.1
EDGE_QUALITY=3
APERTURE_SHAPE=6

; ----------------------------------------------------------------------------
;  Lens effects - kept subtle or off
; ----------------------------------------------------------------------------
[VIGNETTING]
STRENGTH=0.25
FOV_DEPENDENCE=0

[CHROMATIC_ABERRATION]
ENABLED=0
SAMPLES=5
LATERAL_DISPERSION=0.003,0.003
UNIFORM_DISPERSION=0,0

[HEAT_SHIMMER]
; Heat haze over hot tarmac and behind exhausts (CSP reworks the sources).
ENABLED=1
HEAT_PARTICLE_RADIUS=0.75
HEAT_PARTICLE_SHIMMER=0.004
HEAT_PARTICLE_COORD=1.5
HEAT_PARTICLE_FRACTAL_OCTAVES=3
HEAT_PARTICLE_COLOR=1,1,1
HEAT_PARTICLE_MAX_NUMBER=10
HEAT_PARTICLE_MIN_LIFE=0.75
HEAT_PARTICLE_LIFE_MULT=1.0
HEAT_PARTICLE_INTENSITY_MULT=0.3
HEAT_PARTICLE_MIN_INTENSITY=0.15
HEAT_PARTICLE_VELOCITY_MULT=0.2
HEAT_PARTICLE_MIN_VELOCITY=0
HEAT_PARTICLE_RADIUS_VELOCITY_MULT=0.1
HEAT_PARTICLE_POSITION_VELOCITY=0,0,0.2

[FEEDBACK]
ENABLED=0
ASPECT_RATIO=0
WEIGHT=0.05
CURRENT_WEIGHT=-0.05
TIME=0.1

[DIAPHRAGM]
ROTATE_SCALE=0
ROTATE_OFFSET=2
TYPE=1

[AIRYDISC]
ENABLED=0
WAVELENGTH=500
AIRY_DISC_DISPERSION_ENABLED=1

[LENSDISTORTION]
ENABLED=0
ROUNDNESS=0.05
SMOOTHNESS=1.0

[ANTIALIAS]
ENABLED=1
START_DISTANCE=0.1
END_DISTANCE=1000

; ============================================================================
;  Tuning tips
;  - Too bright/dark with Pure: change brightness/exposure in the Pure Config
;    app (PP section) rather than here - Pure owns exposure.
;  - Too bright/dark without Pure: AUTO_EXPOSURE TARGET (0.24 darker, 0.32
;    brighter).
;  - Less contrast/saturation: COLOR CONTRAST and SATURATION back to 1.0.
;  - Less bloom: GLARE THRESHOLD 3.5. More: 1.8.
;  - No replay depth of field: DOF ENABLED=0.
;  - Stronger vignette: VIGNETTING STRENGTH 0.35. None: 0.
;  CSP's in-game PP filter editor can change all of this live.
; ============================================================================
