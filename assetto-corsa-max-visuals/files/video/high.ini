; ============================================================================
;  Max Visuals - HIGH video settings
;  install.ps1 merges these keys into  Documents\Assetto Corsa\cfg\video.ini
;  Resolution, fullscreen/windowed mode, refresh rate, V-sync and the FPS
;  limit are NOT touched. Same values as Content Manager > Settings >
;  Assetto Corsa > Video if you prefer to set them by hand.
; ============================================================================

[VIDEO]
AASAMPLES=4
ANISOTROPIC=16
SHADOW_MAP_SIZE=4096

[ASSETTOCORSA]
WORLD_DETAIL=5

[EFFECTS]
; Must be 0: AC's own motion blur disables CSP Extra FX (which has its own).
MOTION_BLUR=0
RENDER_SMOKE_IN_MIRROR=1
SMOKE=4

[POST_PROCESS]
ENABLED=1
QUALITY=5
FILTER=MaxVisuals
GLARE=5
DOF=5
RAYS_OF_GOD=1
HEAT_SHIMMER=1
; Keep FXAA on: CSP hooks the FXAA stage to run SMAA, CAS and other effects.
FXAA=1

[MIRROR]
HQ=1
SIZE=1024

[CUBEMAP]
; Reflections: CSP's Reflections FX resolution is set to match (512).
SIZE=512
; Two faces per frame; CSP reprojects the rest so it looks close to six.
FACES_PER_FRAME=2
FARPLANE=1000

[SATURATION]
LEVEL=100
