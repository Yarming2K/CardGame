; ============================================================================
;  Max Visuals - ULTRA video settings
;  install.ps1 merges these keys into  Documents\Assetto Corsa\cfg\video.ini
;  Resolution, fullscreen/windowed mode, refresh rate, V-sync and the FPS
;  limit are NOT touched. Same values as Content Manager > Settings >
;  Assetto Corsa > Video if you prefer to set them by hand.
; ============================================================================

[VIDEO]
; MSAA 8x (Content Manager labels it "experimental"). With Extra FX TAA on,
; 4x looks nearly identical and is much cheaper: drop to 4 first if FPS is low.
AASAMPLES=8
ANISOTROPIC=16
; 8192 shadow maps need ~1 GB of VRAM; use 4096 on cards with less than 12 GB.
SHADOW_MAP_SIZE=8192

[ASSETTOCORSA]
WORLD_DETAIL=5

[EFFECTS]
; Must be 0: AC's own motion blur disables CSP Extra FX (which has its own).
MOTION_BLUR=0
RENDER_SMOKE_IN_MIRROR=1
SMOKE=5

[POST_PROCESS]
ENABLED=1
QUALITY=5
FILTER=MaxVisuals
GLARE=5
DOF=5
RAYS_OF_GOD=1
HEAT_SHIMMER=1
; Keep FXAA on: CSP hooks the FXAA stage to run SMAA, CAS and other effects.
FXAA=1

[MIRROR]
HQ=1
SIZE=2048

[CUBEMAP]
; Reflections: CSP's Reflections FX resolution is set to match (1024).
SIZE=1024
; All six cubemap faces updated every frame (always up-to-date reflections).
FACES_PER_FRAME=6
FARPLANE=1500

[SATURATION]
LEVEL=100
