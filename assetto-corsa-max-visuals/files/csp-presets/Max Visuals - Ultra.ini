; ============================================================================
;  Max Visuals - ULTRA  |  Custom Shaders Patch preset for Content Manager
; ----------------------------------------------------------------------------
;  Every visual CSP feature at its highest sensible quality. Target hardware:
;  RTX 4070 Ti / RX 7900 XT class GPU or better, 12 GB+ VRAM, single screen.
;  Use "Max Visuals - High" if you can't hold your target frame rate.
;
;  Apply: drag this file onto Content Manager, or put it in
;    %LOCALAPPDATA%\AcTools Content Manager\Presets\Custom Shaders Patch Presets\
;  and pick it in Content Manager > Settings > Custom Shaders Patch (presets
;  button at the bottom of the page). install.ps1 also applies it directly.
;
;  AFFECTED_SECTIONS is intentionally empty: Content Manager then MERGES these
;  values into your current CSP settings instead of resetting whole modules.
;  Your weather style (Pure/Sol), controls, audio, UI, VR and physics
;  settings are never touched.
;
;  Key names follow CSP's own module configs (extension/config/*.ini).
; ============================================================================

[CONFIGURATION]
VERSION=1
AFFECTED_SECTIONS=

; ---------------------------------------------------------------- Graphics Adjustments
; Native resolution, no upscaling (max quality)
[GRAPHICS_ADJUSTMENTS:RENDER_SCALE]
SCALE=1

[GRAPHICS_ADJUSTMENTS:FSR]
ACTIVE=0

; Detailed models stay in view twice as far: much less pop-in
[GRAPHICS_ADJUSTMENTS:LODS]
CARS_DISTANCE_MULT=2
TRACK_DISTANCE_MULT=2
TREES_DISTANCE_MULT=2

; Tonemapped MSAA resolve with the higher-quality custom kernel
[GRAPHICS_ADJUSTMENTS:ANTIALIASING_MSAA]
CUSTOM_RESOLVE=1
CUSTOM_KERNEL=1
CUSTOM_RESOLVE_MIRROR=1

; SMAA instead of FXAA, plus AMD FidelityFX CAS sharpening (CSP's recommended
; pairing with Extra FX TAA, whose own extra sharpening is turned off below)
[GRAPHICS_ADJUSTMENTS:ANTIALIASING]
MODE=SMAA
QUALITY=ULTRA
FFXCAS_PASS=1
FFXCAS_SHARPNESS=0.4

[GRAPHICS_ADJUSTMENTS:COLOR_BUFFER]
ACTIVE=1
FULL_RESOLUTION=1

; ---------------------------------------------------------------- Extra FX
; Second rendering pass that powers TAA, SSLR, AO, screen-space lighting,
; volumetric headlights and more. Needs: single screen, post-processing ON,
; AC's own motion blur OFF (the installer sets that in video.ini).
[EXTRA_FX:BASIC]
ENABLED=1
EXTERIOR_ONLY=0

[EXTRA_FX:TAA]
ENABLED=1
EXTERIOR_ONLY=0
EXTRA_SHARPEN_PASS=0

; Screen-space reflections, Hi-Z tracing at the maximum 200 steps
[EXTRA_FX:SSLR]
ENABLED=1
EXTERIOR_ONLY=0
TRACING_QUALITY3=4
STEPS_HIZ=200
EXTRA_SPECULARS=1
SCALE=1

; Ambient occlusion: HBAO+ (ASSAO and legacy SSAO switched off so HBAO+ is used)
[EXTRA_FX:HBAO]
ENABLED=1
EXTERIOR_ONLY=0
OPACITY=0.8

[EXTRA_FX:ASSAO]
ENABLED=0

[EXTRA_FX:SSAO]
ENABLED2=0

[EXTRA_FX:SS_LIGHTING]
ENABLED=1
SCALE=1
EMISSIVE=1

[EXTRA_FX:LIGHT_BOUNCE]
ENABLED=1
CARS=1

[EXTRA_FX:VOLUMETRIC_LIGHTS]
ENABLED=1
EXTERIOR_ONLY=0
SCALE=0.32
INTENSITY_MULT=1.5

[EXTRA_FX:FOG_BLUR]
ENABLED=1
HEATING=1
EXTERIOR_ONLY=0

; Motion blur on exterior/replay cameras only, cockpit stays crisp
; (EXTERIOR_ONLY: 0 = always, 1 = exterior views, 2 = replays only)
[EXTRA_FX:MOTION_BLUR]
ENABLED=1
EXTERIOR_ONLY=1
MULT=0.5
QUALITY_2=2

; ---------------------------------------------------------------- Shadows
[SMART_SHADOWS:BASIC]
ENABLED=1
AUTOMATIC_SPLITS=1
AUTOMATIC_SPLITS_DISTANCE=250

[SMART_SHADOWS:SMOOTH_CASCADES]
ENABLED=1

[SMART_SHADOWS:CUSTOM_SHADOW_MATRICES]
ENABLED=1
STABILIZED=1
FOURTH_CASCADE=1
FOURTH_CASCADE_DISTANCE=2000

; ---------------------------------------------------------------- Lights
; Dynamic shadows from headlights and track lights (default is off!)
[LIGHTING_FX:SHADOWS]
ENABLED=1
FULL_RESOLUTION=1
CARS_SHADOWS=4
SPECTATING_CARS_SHADOWS=5
CARS_IN_TRACK_SHADOWS=1
HIGH_QUALITY_HEADLIGHT_SHADOWS=1
DETAILED_SHADOWS_FROM_CARS_NEARBY=3

[LIGHTING_FX:PERFORMANCE]
CARS_WITH_LIGHTS=20
ENABLE_TREES_LIGHTING=1
ENABLE_REARVIEWMIRROR_LIGHT=2
ENABLE_REFLECTION_LIGHT=1

[CAR_INSTRUMENTS:VISUALS]
DISTANT_HEADLIGHTS_GLARE=1

; ---------------------------------------------------------------- Reflections
; 1024 px cubemaps (CSP warns 2048 can break physically-based shading)
[REFLECTIONS_FX:MAIN_CUBEMAP]
RESOLUTION2=1024
REPROJECT_PARTIAL=1

[SMART_MIRROR:REAL_MIRRORS]
ENABLED=1

; ---------------------------------------------------------------- Particles
[PARTICLES_FX:AC_PARTICLES]
SOFT_PARTICLES=1
REWORKED_HEAT_SHIMMER=1

[PARTICLES_FX:SPARKS]
ENABLED=1

[PARTICLES_FX:SMOKE]
ENABLED=1
USE_DOWNSCALING=0
QUANTITY_SCALE=1.2
SIMPLIFIED_SHADING=0
LONG_LASTING_SMOKE=1
CAST_SHADOWS=1
CAST_AMBIENT_SHADOWS=1
SHOW_IN_MIRRORS=1

[PARTICLES_FX:FLAMES]
ENABLED=1
USE_DYNAMIC_SHADOWS=1

[PARTICLES_FX:PIECES]
ENABLED=1
CAST_SHADOWS=1
SHOW_IN_MIRRORS=1

[SKIDMARKS_FX:NEW_IMPLEMENTATION]
ENABLED=1
ADVANCED_BLENDING=1

; ---------------------------------------------------------------- Environment
[GRASS_FX:BASIC]
ENABLED=1
QUALITY=4

[GRASS_FX:RENDERING]
SMOOTHER_BLENDING=1
CAST_SHADOWS=1
EXTRAFX_PASS=1

[RAIN_FX:VISUAL_TWEAKS]
RAIN_MAPS_QUALITY=0

[TRACK_ADJUSTMENTS:MISCELLANEOUS]
TREES_RECEIVE_SHADOWS=1
TREES_A2C_DITHERING=1

; Weather FX quality options only. The weather style/controller you picked
; (Pure, Sol, default) is NOT changed.
[WEATHER_FX:PERFORMANCE]
HIGH_QUALITY_STARS=1
EXTRA_CLOUDS_FIDELITY=1
ADDITIONAL_EFFECTS=1
DETAILED_CLOUD_SHADOWS=1
SLOW_REFLECTIONS_UPDATE=0

[WEATHER_FX:MISCELLANEOUS]
USE_MIRAGE_REFLECTIONS=1

[WEATHER_FX:STATIC_REFLECTIONS]
INCLUDE_EMISSIVES=1

[WEATHER_FX:PP_TWEAKS]
FULL_RESOLUTION=1

; ---------------------------------------------------------------- Screenshots
; F8 screenshots: 48-sample accumulation anti-aliasing, maximum JPEG quality
[NICE_SCREENSHOTS:WINDOWS_IMAGING_COMPONENT]
USE=1
QUALITY=100

[NICE_SCREENSHOTS:ACCUMULATION_AA]
ENABLED=1
ITERATIONS=48

[NICE_SCREENSHOTS:ACCUMULATION_SHADOWS]
ENABLED=1
